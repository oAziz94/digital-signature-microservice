name: CI/CD Workflow

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main

# Define the jobs in the workflow
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run tests (Optional: Skip if no tests are ready)
      - name: Run tests
        run: |
          echo "No tests yet"
          # Uncomment the following line when tests are ready
          # npm test

  deploy-to-heroku:
    name: Deploy to Heroku
    needs: build-and-test # Only run if build-and-test succeeds
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Heroku
      - name: Log in to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "machine api.heroku.com
          login ${{ secrets.HEROKU_EMAIL }}
          password ${{ secrets.HEROKU_API_KEY }}" > ~/.netrc

      # Step 3: Deploy to Heroku
      - name: Deploy to Heroku
        run: |
          git remote add heroku https://git.heroku.com/digital-signature-microservice.git
          git push heroku main
